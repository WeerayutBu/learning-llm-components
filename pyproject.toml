[project]
name = "inf-entity-linking"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2,<3",
    "streamlit>=1.45,<2",
    "pandas>=2.2,<3",
    "torch>=2.6,<3",
    "ipykernel<7",
    "nbformat>=5,<6",
    "nbclient>=0.10,<1",
    # Dependencies of the ReFinED source included in refined/.
    "nltk>=3.5",
    "Unidecode>=1.1.1",
    "ujson",
    "tqdm",
    "lmdb>=1.0",
    "boto3",
    "botocore",
    "transformers>=4.38,<4.40",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
