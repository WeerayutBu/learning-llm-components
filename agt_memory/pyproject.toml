[project]
name = "agt-memory"
version = "0.1.0"
requires-python = ">=3.11"
# Pure API — no torch / ML stack, so it installs on macOS too.
dependencies = [
    "python-dotenv",
    # <7: the VS Code Jupyter extension can't drive ipykernel 7's protocol yet —
    # it reports ipykernel as missing and asks you to pip install it.
    "ipykernel<7",
    "openai>=2.45.0",
]
